name: probe2
# 一次性診斷：curl_cffi（impersonation）能否讓 runner IP 通過 TikTok / YouTube。
# 測完就刪。

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: 比較有無 impersonation
        shell: bash
        run: |
          set +e
          pip() { python3 -m pip "$@" 2>/dev/null || python3 -m pip --break-system-packages "$@"; }
          TT='https://www.tiktok.com/@scout2015/video/6718335390845095173'
          YT='https://www.youtube.com/watch?v=jNQXAC9IVRw'
          ty() { yt-dlp --simulate --no-warnings --print '%(id)s | %(height)sp | %(title).30s' "$1" 2>&1; }
          pip install --upgrade --quiet "yt-dlp[default]"
          echo "=== tiktok 無 curl_cffi ==="
          o=$(ty "$TT"); c=$?; printf '%s\n' "$o" | tail -2; echo "exit=$c"
          echo "=== youtube 無 curl_cffi ==="
          o=$(ty "$YT"); c=$?; printf '%s\n' "$o" | tail -2; echo "exit=$c"
          pip install --quiet curl_cffi
          echo "=== curl_cffi 安裝後 ==="
          python3 -c "import curl_cffi; print('curl_cffi', curl_cffi.__version__)"
          echo "=== tiktok 有 curl_cffi ==="
          o=$(ty "$TT"); c=$?; printf '%s\n' "$o" | tail -2; echo "exit=$c"
          echo "=== youtube 有 curl_cffi ==="
          o=$(ty "$YT"); c=$?; printf '%s\n' "$o" | tail -2; echo "exit=$c"
