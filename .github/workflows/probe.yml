name: probe
# 一次性診斷用：找出在這台 runner 上能用的 YouTube player_client。
# 測完就刪。

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: 測各種 client
        shell: bash
        run: |
          set +e
          python3 -m pip install --upgrade --quiet "yt-dlp[default]" \
            || python3 -m pip install --upgrade --quiet --break-system-packages "yt-dlp[default]"
          yt-dlp --version
          URL='https://www.youtube.com/watch?v=jNQXAC9IVRw'
          for c in default android_vr mweb ios tv_embedded web_embedded tv_simply web; do
            echo "=== client: $c ==="
            out=$(yt-dlp --no-warnings --js-runtimes node --simulate \
                    --print '%(id)s | %(title).30s | %(height)sp' \
                    -f 'bv*[height<=720]+ba/b' \
                    --extractor-args "youtube:player_client=$c" "$URL" 2>&1)
            code=$?
            printf '%s\n' "$out" | tail -4
            echo "RESULT $c exit=$code"
          done
